[pytest]
testpaths = tests

# 파일명에 '.example.' 이 든 것은 템플릿 예시다. 게이트(tools/gate.ps1)도 같은 규칙으로
# 실작업 테스트에서 제외한다. pytest 는 'test_app.example.py' 를 모듈 'test_app.example'
# 로 임포트하려다 ModuleNotFoundError 로 수집 자체가 중단되므로, 여기서 함께 제외해야
# 같은 폴더의 실작업 테스트가 정상 수집된다.
addopts = --ignore-glob=*.example.py
norecursedirs = .git .pytest-tmp .pytest_cache __pycache__ .claude .codex
