<script>
(function(){
var D=JSON.parse(document.getElementById('status').textContent);
var NAME={U:'내 차례',A:'진행',X:'미착수','?':'모름',O:'끝','-':'해당없음'};
var CLS={U:'U',A:'A',X:'X','?':'Q',O:'O','-':'N'};
// 흐름도 블록 상태. 데이터 상태(U·A·X·?·O·-)를 사람이 판단할 말로 바꾼다. 막힘 = 열린 이슈
var KN={O:'끝',A:'진행',T:'착수전',B:'막힘',H:'사람대기',P:'보류',Q:'모름',N:'해당없음'};
var KO=['O','A','T','B','H','P','Q','N'];
// 공유용 전체현황이 srcdoc 으로 내장할 때만 __SHARE/__HASH 를 주입한다. 이때 파일 링크는 글자로만 그린다
var SHARE=!!window.__SHARE;
var open=decodeURIComponent(window.__HASH!=null?window.__HASH:location.hash.slice(1))||null;
var embedded=window.parent!==window;
document.body.classList.toggle('embedded',embedded);
function col(s){return 'var(--'+CLS[s]+')'}
// 상대 경로 -> VS Code 링크. 데이터는 상대 경로 그대로 둔다
function vs(l){if(!l||/^[a-z][a-z0-9+.-]*:/i.test(l))return l;var u=new URL(l,location.href);if(u.protocol!=='file:')return u.href;
  return 'vscode://file/'+encodeURI(decodeURIComponent(u.pathname).replace(/^\/(?=[A-Za-z]:)/,''))}
// VS Code 링크 클릭 시 경로도 복사. VS Code 내장 브라우저는 vscode:// 링크를 열지 않으므로 Ctrl+P 붙여넣기로 대신한다
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="vscode://file/"]');if(!a)return;
  var p=decodeURIComponent(a.getAttribute('href').slice(14)).replace(/\//g,String.fromCharCode(92));
  var t=document.createElement('div');t.className='toast';document.body.appendChild(t);
  function say(ok){t.textContent=ok?'경로 복사됨 · VS Code가 안 열리면 Ctrl+P 에 붙여넣기':'VS Code가 안 열리면 Ctrl+P 에 이 경로: '+p}
  var ok=false,x=document.createElement('textarea');x.value=p;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{ok=document.execCommand('copy')}catch(_){}x.remove();
  say(ok);setTimeout(function(){t.remove()},ok?3500:9000);
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(p).then(function(){say(true)},function(){});
});
// 링크는 파일만. 폴더(끝이 /)나 빈 링크는 글자로만 그린다
function isFile(l){return !!l&&l.charAt(l.length-1)!=='/'}
function lnk(l,txt){if(l&&l.charAt(0)==='#')return '<a href="'+esc(l)+'" data-open="'+esc(l.slice(1))+'">'+esc(txt)+'</a>';return isFile(l)&&!SHARE?'<a href="'+esc(vs(l))+'" title="VS Code에서 열기">'+esc(txt)+'</a>':'<span>'+esc(txt)+'</span>'}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function st(s,txt){return '<span class="st s'+CLS[s]+'">'+esc(txt||NAME[s])+'</span>'}
function days(s){var m=/(\d{4})-(\d\d)-(\d\d)(?: (\d\d):(\d\d))?/.exec(s||'');if(!m)return null;
  return Math.floor((Date.now()-new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0)))/86400000)}
function ageHtml(s){var d=days(s);if(d==null)return '<span class="age old">기준 시각 없음</span>';
  return '<span class="age" title="마지막 변경 '+esc(s)+'">'+(d<=0?'오늘 변경':d+'일 전 변경')+'</span>'}
function pct(n,m){return Math.floor(n/m*100)}
function gauge(n,m,s){return '<div class="gauge" style="--c:'+(s==='U'||s==='A'||s==='O'?col(s):'var(--X)')+'"><i style="width:'+pct(n,m)+'%"></i></div>'}
// 이슈의 현재 단계: 미해결(0.·1.·2.)은 고칠 책임이 있는 원인 단계, 조치 끝(3.done)·보관(4.archive)은 사람 확인 단계인 시험. 원인 미정도 시험
function stageOf(c){c=(c||'').toLowerCase();if(/impl/.test(c))return '구현';if(/design|docs|prd|srs|sad|sdd/.test(c))return '설계';return '시험'}
function open_(i){return /^[0-2][.]/.test(i.state)}
function nowStage(i){return open_(i)?stageOf(i.cause):'시험'}

// 끝인데 비율도 근거도 없으면 정직하게 '모름'

// 블록 -> 다음 행동 [담당 분류, 담당, 할 일, 보조 설명]. 사람할일 블록은 아래 '사람이 해야 할 것'에 따로 나온다

  if(n.cls==='issue')return ['x','이슈',n.title+' 원인 단계 조치',n.desc];
  if(n.id==='fin'&&n.k==='H')return ['p','사람','확인대기 이슈 확인 후 종결',n.desc];
  if(n.k==='H')return ['p','사람',n.title+' 사람 확인',n.desc];
  if(n.k==='Q')return ['p','사람',n.title+' 실제 상태 확인','끝으로 기록됐지만 비율·근거 없음'];
  if(n.k==='P')return ['p','사람',n.title+' 재개 여부 결정',n.desc];
  return ['l','LLM',n.title+' '+(n.k==='T'?'착수':'마무리'),[n.m?(n.n||0)+'/'+n.m:'',n.desc].filter(Boolean).join(' · ')]}
function actRow(n,a){return '<li data-id="'+n.id+'"><span class="who '+a[0]+'">'+a[1]+'</span><div>'+esc(a[2])+'<div class="s2">'+esc(a[3]||'')+'</div></div><span></span></li>'}
function nextActs(){var A=G.nodes.map(function(n){return [n,action(n)]}).filter(function(x){return x[1]}),od={x:0,p:1,l:2};
  A.sort(function(a,b){return od[a[1][0]]-od[b[1][0]]||a[0].col-b[0].col});
  return '<p class="lbl">다음 행동 '+A.length+'건 · 누르면 블록 상세</p><ul class="acts">'+(A.map(function(x){return actRow(x[0],x[1])}).join('')||'<li>없음</li>')+'</ul>'}
// 범례의 상태 = 개수 + 누르면 그 상태만
function legend(){var cnt={};G.nodes.forEach(function(n){cnt[n.k]=(cnt[n.k]||0)+1});
  return KO.map(function(k){return '<button data-k="'+k+'" class="k-'+k+(cnt[k]?'':' zero')+'" title="누르면 이 상태만"><i></i>'+KN[k]+' <b>'+(cnt[k]||0)+'</b></button>'}).join('')
  +[['main','본흐름'],['done','끝난 흐름'],['branch','갈라짐'],['merge','합류'],['human','사람 관문'],['loop','이슈 반송']].map(function(e){return '<span><svg width="24" height="6"><path class="e e-'+e[0]+'" d="M0,3H24"/></svg>'+e[1]+'</span>'}).join('')
  +'<span style="color:var(--A);font-weight:600">⑂ 브랜치화 후보</span>'}
// 드로어 내용: 요약 → 다음 행동 → 항목 전체 → 이슈 → 단계 상세 → 이어진 블록
function drawerHtml(n){var a=action(n),it=n.items||[],h='<button class="x" title="닫기 (Esc)">×</button>';
  h+='<h2 class="k-'+n.k+'"><i class="dot"></i><span class="tt">'+esc(n.title)+'</span>'+(canEdit(n)?'<button class="ed" title="제목 고치기">✎</button>':'')+'<em>'+KN[n.k]+'</em></h2>';
  if(n.title!==n.auto)h+='<div class="s2">자동 제목: '+esc(n.auto)+'</div>';
  if(n.desc)h+='<div class="s2">'+esc(n.desc)+'</div>';h+=prog(n);
  if(n.hint)h+='<div class="hint">⑂ '+esc(n.hint)+'</div>';
  if(a)h+='<h3>다음 행동</h3><ul class="acts">'+actRow(n,a)+'</ul>';
  if(n.id==='hum'){h+='<h3>사람이 해야 할 것 <span class="n">'+G.todo.length+'개 문서</span></h3><ul class="acts">'+G.todo.map(function(t){return '<li><span class="who p">사람</span><div>'+lnk(t.link,t.text)+'</div><span class="c">'+t.count+'</span></li>'}).join('')+'</ul>'
    +'<div class="foot2">사람할일/대기중 파일·이슈 폴더에서 자동 집계 · 커밋·세션 시작 때 갱신</div>'}
  else if(it.length)h+='<h3>항목 <span class="n">'+it.length+'</span></h3><ul class="acts">'+it.map(function(i){return '<li><span class="s2">'+esc(i.tag||'')+'</span><div>'+lnk(i.link,i.text)+'</div><span></span></li>'}).join('')+'</ul>';
  if(n.iss){var i=n.iss;h+='<h3>이슈</h3><ul class="acts"><li><span class="s2">'+esc(i.state)+'</span><div>'+lnk(n.link,i.id+' 파일 열기')+'<div class="s2">원인: '+esc(i.cause||'미정')+(i.fixedAt?' · 조치: '+esc(stageOf(i.fixedAt)):'')+'</div></div><span></span></li></ul>'}
  var s=n.open&&D.stages.filter(function(s){return s.name===n.open})[0],d=n.open&&detailOf(n.open);
  if(s&&d){var S=fix(s);h+='<h3>'+esc(n.open)+' 단계 상세 '+st(S)+'</h3>'+(s.basis?'<div class="s2">근거: '+esc(s.basis)+'</div>':'')+detailHtml(d,col(S==='U'||S==='A'||S==='O'?S:'X'))}
  function chips(ids){return ids.length?'<div class="chips">'+ids.map(function(id){var m=nodeOf(id);return '<button data-id="'+id+'" class="k-'+m.k+'"><i class="dot"></i>'+esc(m.title)+'</button>'}).join('')+'</div>':'<span class="s2">없음</span>'}
  h+='<h3>앞 블록</h3>'+chips(G.edges.filter(function(e){return e.to===n.id}).map(function(e){return e.from}));
  h+='<h3>다음 블록</h3>'+chips(G.edges.filter(function(e){return e.from===n.id}).map(function(e){return e.to}));
  return h}
function openDrawer(id){var n=nodeOf(id),x=document.getElementById('drawer');if(!n)return;
  sel=id;filter=null;shade();x.innerHTML=drawerHtml(n);x.classList.add('on');x.scrollTop=0;bind(x);
  x.querySelector('.x').onclick=closeDrawer;
  var ed=x.querySelector('.ed');if(ed)ed.onclick=function(){editTitle(n)};
  [].forEach.call(x.querySelectorAll('[data-id]'),function(b){b.onclick=function(e){if(e.target.closest('a'))return;pick(b.getAttribute('data-id'),true)}})}
// Enter·바깥 클릭 = 저장, Esc = 취소, 빈 칸 = 자동 제목으로 되돌림
function editTitle(n){var tt=document.querySelector('#drawer .tt'),done=false;
  tt.innerHTML='<input class="ti" value="'+esc(n.title)+'" placeholder="'+esc(n.auto)+'">';var inp=tt.firstChild;inp.focus();inp.select();
  function end(save){if(done)return;done=true;
    if(save)setTitle(n,inp.value.trim());
    openDrawer(n.id)}
  inp.onkeydown=function(e){e.stopPropagation();if(e.key==='Enter')end(true);else if(e.key==='Escape')end(false)};
  inp.onblur=function(){end(true)}}
function bindNext(){[].forEach.call(document.querySelectorAll('#next li[data-id]'),function(li){li.onclick=function(){pick(li.getAttribute('data-id'),true)}})}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');sel=null;shade()}
// '#시험' 같은 단계 링크 = 그 단계를 연 첫 블록의 드로어
function bind(root){[].forEach.call(root.querySelectorAll('[data-open]'),function(a){a.onclick=function(e){e.preventDefault();e.stopPropagation();var n=G.nodes.filter(function(n){return n.open===a.getAttribute('data-open')})[0];if(n)pick(n.id,true)}})}
function pick(id,scroll){openDrawer(id);
  if(scroll){var el=document.querySelector('.nd[data-id="'+id+'"]');if(el)el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}}
function render(){
  var k=D.todo.filter(function(t){return!t.done}).reduce(function(a,t){return a+t.count},0);
  var key=D.stages.filter(function(s){return s.name===(D.key||D.stage)})[0];
  var h='';
  // 상단: 요약
  h+='<section class="card"><div class="head"><h1>'+esc(D.code)+'</h1><span class="nm">'+esc(D.name)+'</span>'+ageHtml(D.asof);
  h+='<button id="tsave" hidden title="'+esc(D.code)+' 폴더의 프로젝트현황.html 옆에 저장"></button>';
  h+='<span class="todo-n'+(k?'':' zero')+'" id="todo-n">'+(k?'내 할 일 '+k+'건':'내 할 일 없음')+'</span></div>';
  var ov=overall();
  if(ov&&ov.pct==null)h+='<div class="big"><b>?</b><span>전체 진척 계산 불가 · '+esc(ov.unknown)+' 단계 모름</span></div>';
  else if(ov)h+='<div class="big"><b>'+ov.pct+'%</b><span>전체 진척 · '+ov.parts.map(function(x){return x.name+' '+x.pct+'%'}).join(' · ')+' 평균'+(D.stage&&ov.pct<100?' · 지금 '+esc(D.stage)+' 단계':'')+'</span></div>'+gauge(ov.pct,100,ov.pct>=100?'O':'A');
  else if(key&&key.n!=null&&key.m)h+='<div class="big"><b>'+pct(key.n,key.m)+'%</b><span>'+esc(D.stage?D.stage+' 단계':D.key)+' · '+key.n+' / '+key.m+' 끝</span></div>'+gauge(key.n,key.m,key.state);
  h+='<div class="legend">'+legend()+'</div></section>';
  // 중단: 흐름도. 블록 상세는 오른쪽 드로어
  h+='<div class="canvas" id="canvas"><div class="fg" id="graph"></div></div><aside class="drawer" id="drawer"></aside>';
  // 하단: 지금 하는 일 | 다음 행동
  h+='<div class="etc"><section class="card"><p class="lbl">지금 하는 일</p><table class="now">';
  D.now.forEach(function(r){h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'});
  h+='</table>'+(isFile(D.nowLink)&&!SHARE?'<a class="foot" href="'+esc(vs(D.nowLink))+'" title="VS Code에서 열기">작업 파일 열기 (VS Code)</a>':'')+'</section>';
  h+='<section class="card" id="next">'+nextActs()+'</section>';
  if(D.mismatch&&D.mismatch.length){h+='<section class="card warn"><p class="lbl">맞지 않는 곳 '+D.mismatch.length+'</p><ul>';D.mismatch.forEach(function(m){h+='<li>'+esc(m)+'</li>'});h+='</ul></section>'}
  h+='</div><div class="foot">마지막 변경 '+esc(D.asof)+' · '+esc(D.note)+(D.up?' · <a class="uplink" href="'+esc(D.up)+'">위로: 전체현황</a>':'')+'</div>';
  document.getElementById('app').innerHTML=h;
  draw();
  document.getElementById('canvas').onclick=function(e){if(e.target.closest('a'))return;var nd=e.target.closest('.nd');if(nd)pick(nd.getAttribute('data-id'));else closeDrawer()};
  [].forEach.call(document.querySelectorAll('.legend button'),function(b){b.onclick=function(){var v=b.getAttribute('data-k');document.getElementById('drawer').classList.remove('on');sel=null;filter=filter===v?null:v;shade()}});
  bindNext();document.getElementById('tsave').onclick=saveTitles;updSave();
  if(nodeOf('hum'))document.getElementById('todo-n').onclick=function(){pick('hum',true)};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});
  // 해시(#시험 등)로 들어오면 그 단계 블록을 연다
  var n0=open&&G.nodes.filter(function(n){return n.open===open})[0];if(n0)pick(n0.id,true);
}
render();
// 숨겨진 iframe 에서 그리면 크기가 0이라 연결선이 틀어진다. 크기가 바뀌면 다시 그린다
window.addEventListener('resize',draw);
if(embedded)window.parent.postMessage({type:'project-status',data:D},'*');
})();
</script>
</body>
</html>
